name: Backend tests + brain eval
on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/backend-brain.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-brain.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      FRONTEND_ORIGINS: https://app.donexto.com
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: test-secret-key-not-real
      OAUTH_ENCRYPTION_KEY: test-oauth-encryption-key-32chars!!
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Full backend suite
        run: python -m pytest -q
      - name: Brain corpus eval (baseline OFF + acceptance ON)
        shell: bash
        run: |
          set -euo pipefail
          rm -f brain-eval.json
          python scripts/eval_brain.py --flag both --check --json brain-eval.json 2>&1 | tee brain-eval.txt
          { echo '```'; cat brain-eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate brain eval JSON
        shell: bash
        run: |
          set -euo pipefail
          test -s brain-eval.json
          python - <<'PY'
          import json, sys
          data = json.load(open("brain-eval.json", encoding="utf-8"))
          assert isinstance(data, list) and {r.get("flag") for r in data} == {"OFF", "ON"}, "faltan corridas OFF/ON"
          for run in data:
              assert run.get("emails", 0) > 0, f"{run.get('flag')}: sin correos evaluados"
              assert run.get("errors") == 0, f"{run.get('flag')}: errors={run.get('errors')}"
              assert run.get("partd"), f"{run.get('flag')}: sin resultados parte D"
          print("brain-eval.json válido:", [(r["flag"], r["emails"], r["errors"]) for r in data])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brain-eval
          path: backend/brain-eval.json
