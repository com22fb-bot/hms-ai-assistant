name: Donexto backup daily
on:
  schedule: [{cron: "0 9 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PG17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump + encrypt + upload + verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          F="donexto-db-$(date -u +%Y%m%dT%H%MZ).dump.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -Fc --no-owner --no-privileges \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/$F" 3<<<"$BACKUP_PASSPHRASE"
          SHA=$(sha256sum "$RUNNER_TEMP/$F" | cut -d' ' -f1)
          for i in 1 2 3 4 5; do
            aws s3 cp "$RUNNER_TEMP/$F" "s3://donexto-backups/db/$F" --endpoint-url "$R2_ENDPOINT" --metadata sha256=$SHA --only-show-errors && break
            [ $i = 5 ] && exit 1; echo "subida falló, reintento $i"; sleep $((i*20))
          done
          aws s3api head-object --bucket donexto-backups --key "db/$F" --endpoint-url "$R2_ENDPOINT" --query '{size:ContentLength,sha256:Metadata.sha256}'
          echo "local sha256 $SHA size $(stat -c%s "$RUNNER_TEMP/$F")"
          rm -f "$RUNNER_TEMP/$F"
      - name: Alerta si falla (correo a Héctor vía Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"from\":\"Donexto Monitor <support@donexto.com>\",\"to\":[\"hmcelinfo@gmail.com\"],\"subject\":\"Donexto: respaldo diario FALLÓ\",\"text\":\"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" >/dev/null
