name: Deploy Donexto app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: donexto-app-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: /api/hms
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository configuration: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test lib/loginGate.test.ts
      - name: Build and deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Check public endpoints
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://app.donexto.com/ -o /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 30 https://app.donexto.com/api/hms/health | node -e 'let s=""; process.stdin.on("data", x => s+=x); process.stdin.on("end", () => { if(JSON.parse(s).status !== "ok") process.exit(1); });'
