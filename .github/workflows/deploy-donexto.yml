name: Deploy Donexto app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-donexto.yml"
permissions:
  contents: read
concurrency:
  group: donexto-app-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: /api/hms
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository configuration: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test lib/loginGate.test.ts lib/i18n/verificationLanguage.test.ts
      - run: node --test scripts/workerPublicEnv.test.mjs
      - name: Build and deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Record deployment result
        run: echo "Worker donexto-app deployed from $GITHUB_SHA. Public endpoint checks run separately." >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public endpoints
        shell: bash
        run: |
          failed=0
          for path in / /api/hms/health; do
            status=$(curl --silent --show-error --retry 3 --max-time 30 -o response.txt -w '%{http_code}' "https://app.donexto.com$path") || status=000
            echo "Endpoint $path: HTTP $status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != 200 ]; then
              echo "::error::Publication completed, but endpoint $path returned HTTP $status. Inspect domain access/security and application health."
              failed=1
            elif [ "$path" = /api/hms/health ]; then
              python3 -c 'import json; assert json.load(open("response.txt")).get("status") == "ok"' || failed=1
            fi
          done
          exit "$failed"
