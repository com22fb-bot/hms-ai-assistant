# Repo PÚBLICO: nunca imprimir valores; no usar upload-artifact.
name: Donexto backup weekly
on:
  schedule: [{cron: "0 9 * * 0"}]   # domingo 03:00 hora CDMX (09:00 UTC)
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: donexto-backup, cancel-in-progress: false}
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: donexto-backups
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secretos presentes (solo nombres)
        env:
          S1: ${{ secrets.SUPABASE_DB_URL }}
          S2: ${{ secrets.BACKUP_PASSPHRASE }}
          S3: ${{ secrets.R2_ACCESS_KEY_ID }}
          S4: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S5: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S6: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S7: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          S8: ${{ secrets.RESEND_API_KEY }}
        run: |
          n=(x SUPABASE_DB_URL BACKUP_PASSPHRASE R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID RESEND_API_KEY)
          m=0; for i in 1 2 3 4 5 6 7 8; do v="S$i"; if [ -n "${!v}" ]; then echo "OK ${n[$i]}"; else echo "FALTA ${n[$i]}"; m=1; fi; done; exit $m
      - name: Herramientas (PG17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Respaldo (Git + BD + Auth + Cloudflare + Railway inventario) cifrado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c '
            TS=$(date -u +%Y%m%dT%H%MZ); W="$RUNNER_TEMP/b/$TS"; mkdir -p "$W"
            git bundle create "$W/repo.bundle" --all
            pg_dump "$SUPABASE_DB_URL" -Fc --no-owner --no-privileges -f "$W/db.dump"
            pg_dump "$SUPABASE_DB_URL" -Fc -n auth --data-only -f "$W/auth_data.dump"
            pg_dumpall -d "$SUPABASE_DB_URL" --roles-only --no-role-passwords -f "$W/roles.sql" || echo "roles: no disponible" > "$W/roles.sql"
            CF="https://api.cloudflare.com/client/v4"; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            curl -fsS -H "$H" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/donexto-app/content/v2" -o "$W/worker.multipart" || echo "WARN worker.multipart no disponible"
            curl -fsS -H "$H" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/donexto-app/settings" -o "$W/worker_settings.json" || echo "WARN worker_settings.json no disponible"
            curl -fsS -H "$H" "$CF/zones/$CLOUDFLARE_ZONE_ID/rulesets" -o "$W/rulesets.json" || echo "WARN rulesets.json no disponible"
            curl -fsS -H "$H" "$CF/zones/$CLOUDFLARE_ZONE_ID/settings" -o "$W/zone_settings.json" || echo "WARN zone_settings.json no disponible"
            curl -fsS -H "$H" "$CF/zones/$CLOUDFLARE_ZONE_ID/dns_records/export" -o "$W/dns.bind" || echo "WARN dns.bind no disponible"
            echo "secrets: GitHub Actions (Doppler sync donexto/prd)" > "$W/env_names_inventory.txt"
            test -s "$W/worker.multipart" || { echo "FALTA worker.multipart"; exit 1; }
            (cd "$W" && sha256sum * > SHA256SUMS)
            tar -C "$RUNNER_TEMP/b" -cf - "$TS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/donexto-weekly-$TS.tar.gpg" 3<<<"$BACKUP_PASSPHRASE"
            F="$RUNNER_TEMP/donexto-weekly-$TS.tar.gpg"; SHA=$(sha256sum "$F" | cut -d" " -f1)
            EP="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
            for i in 1 2 3 4 5; do AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY aws s3 cp "$F" "s3://$R2_BUCKET/weekly/$(basename $F)" --endpoint-url "$EP" --metadata sha256=$SHA --only-show-errors && break; [ $i = 5 ] && exit 1; echo "subida falló, reintento $i"; sleep $((i*20)); done
            # verificación: descarga, sha256 y descifrado de prueba (lista del tar)
            AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY aws s3 cp "s3://$R2_BUCKET/weekly/$(basename $F)" "$F.chk" --endpoint-url "$EP" --only-show-errors
            echo "$SHA  $F.chk" | sha256sum -c --quiet
            gpg --batch -q --pinentry-mode loopback --passphrase-fd 3 -d "$F.chk" 3<<<"$BACKUP_PASSPHRASE" | tar -t >/dev/null
            pg_restore -l "$W/db.dump" > /dev/null
            echo "OK $TS sha256=$SHA size=$(stat -c%s "$F")"
            rm -rf "$RUNNER_TEMP/b" "$F" "$F.chk"'
      - name: Alerta Slack #alertas
        if: failure()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          [ -n "$SLACK_BOT_TOKEN" ] || exit 0
          T=":rotating_light: *Donexto: respaldo semanal FALLÓ* ($(date -u '+%Y-%m-%d %H:%M UTC'))\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          P=$(python3 -c 'import json,sys;print(json.dumps({"channel":"#alertas","text":sys.argv[1].replace("\\n","\n")}))' "$T")
          curl -s -m 15 -X POST https://slack.com/api/chat.postMessage -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' -d "$P" | python3 -c 'import json,sys;print("slack ok:",json.load(sys.stdin).get("ok"))'
      - name: Alerta si falla (correo a Héctor vía Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: hmcelinfo@gmail.com
        run: |
          bash -c 'curl -s -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            -d "{\"from\":\"Donexto Monitor <support@donexto.com>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"Donexto: respaldo semanal FALLÓ\",\"text\":\"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" >/dev/null'
# Restauración de prueba mensual: job separado (restore-test.yml) que descarga el último weekly,
# descifra y hace pg_restore en un service container postgres:17 y compara conteos. Sin escribir en producción.
