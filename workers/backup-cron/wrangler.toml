name = "donexto-backup-cron"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[triggers]
# 09:00 UTC = 03:00 CDMX (UTC-6). Domingo también dispara el semanal.
crons = ["0 9 * * *"]  # 09:00 UTC = 03:00 CDMX; token dedicado GH_DISPATCH_TOKEN (donexto-backup-dispatch)

# Secret: GH_DISPATCH_TOKEN (wrangler secret put). Nunca en el repo.
