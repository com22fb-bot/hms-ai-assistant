name = "donexto-backup-watch"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

# 2º canal de alertas, independiente de GitHub: revisa la antigüedad del último respaldo en R2.
# 15:00 UTC = 09:00 CDMX (después del respaldo de 03:00 del Worker y del de 06:00 de GitHub).
[triggers]
crons = ["0 15 * * *"]

[[r2_buckets]]
binding = "BACKUPS"          # solo se usa list(); nunca escribe ni borra
bucket_name = "donexto-backups"

[vars]
MAX_AGE_HOURS = "30"
SLACK_CHANNEL = "#alertas"
ALERT_TO = "hmcelinfo@gmail.com"
ALERT_FROM = "Donexto Monitor <support@donexto.com>"

# Secrets (wrangler secret put): SLACK_BOT_TOKEN, RESEND_API_KEY. Nunca en el repo.
